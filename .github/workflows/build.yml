name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # A Mac Studio runner slot registered to this repository
    # (https://github.com/0xAndoroid/pika-config/blob/main/ops/ci-runner/studio/README.md). The host's selected Xcode
    # builds the job. Build data goes under RUNNER_TEMP, which the runner empties at every job boundary, because the
    # default DerivedData is shared with everything else that builds on the host.
    runs-on: [self-hosted, macOS, ARM64, studio, ios]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The two simulator builds are the README's commands with the job's derived-data path. They keep code signing
      # on, which needs no certificate for a simulator: an unsigned app has no access to the keychain that holds the
      # sign-in token.
      - name: Build the iOS app
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLiberty -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived-data" build
      - name: Build the tvOS app
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLibertyTV -destination 'generic/platform=tvOS Simulator' -derivedDataPath "$RUNNER_TEMP/derived-data" build
      # The device SDK lacks frameworks that the simulator SDK has, so a simulator build does not show that the
      # app compiles for an Apple TV. Signing for a device needs the team's certificate and provisioning profile;
      # the job compiles unsigned so that it does not depend on what the host's keychain holds.
      - name: Compile the tvOS app for a device
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLibertyTV -destination 'generic/platform=tvOS' -derivedDataPath "$RUNNER_TEMP/derived-data" CODE_SIGNING_ALLOWED=NO build
