name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-preflight:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.select.outputs.skip }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cutoff=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at') || exit 0
          [[ "$cutoff" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || exit 0
          # GitHub can update completed runs later; ambiguous timing must not skip a build.
          previous_sha=$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" \
              -f branch="$GITHUB_REF_NAME" -f event=schedule -f status=completed \
              -f "created=<$cutoff" -F per_page=30 |
            jq -er --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" \
              --arg cutoff "$cutoff" '
              [.workflow_runs[] | select(.id != $id and (.run_number | numbers) < $number
                and (.conclusion == "success" or .conclusion == "failure"))]
              | (max_by(.run_number) // empty)
              | select((.updated_at | fromdateiso8601) < ($cutoff | fromdateiso8601))
              | .head_sha // empty'
          ) || exit 0
          if [[ "$previous_sha" =~ ^[0-9a-f]{40}$ && "$previous_sha" == "$GITHUB_SHA" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: nightly-preflight
    if: >-
      !cancelled() && (needs.nightly-preflight.result != 'success' ||
      needs.nightly-preflight.outputs.skip != 'true')
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app
      - name: Lint Swift
        run: |
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o "$archive"
          printf '%s  %s\n' c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0 "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint
      # The two simulator builds are the README's commands. They keep code signing on, which needs no
      # certificate for a simulator: an unsigned app has no access to the keychain that holds the sign-in token.
      - name: Build the iOS app
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLiberty -destination 'generic/platform=iOS Simulator' build
      - name: Build the tvOS app
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLibertyTV -destination 'generic/platform=tvOS Simulator' build
      # The device SDK lacks frameworks that the simulator SDK has, so a simulator build does not show that the
      # app compiles for an Apple TV. Signing for a device needs a certificate the runner does not have.
      - name: Compile the tvOS app for a device
        run: xcodebuild -project Anilibria.xcodeproj -scheme AniLibertyTV -destination 'generic/platform=tvOS' CODE_SIGNING_ALLOWED=NO build
