[files]
# Xcode writes the project file; its object identifiers are random hexadecimal strings.
extend-exclude = ["*.pbxproj"]

# Misspelled identifiers declared in the iOS code and used in files this fork changes.
[default.extend-identifiers]
sotring = "sotring"
sortings = "sortings"
authorizationInvailid = "authorizationInvailid"
